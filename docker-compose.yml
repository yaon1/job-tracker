services:
  api:
    build: ./api
    ports: ['8000:8000']
    environment:
      CORS_ORIGIN: http://localhost:3000
      API_TOKEN: ${API_TOKEN:-}
      HH_ACCESS_TOKEN: ${HH_ACCESS_TOKEN:-}
    volumes: ['tracker-data:/data']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8000/api/statuses']
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args: { API_BASE: 'http://localhost:8000/api' }
    ports: ['3000:80']
    depends_on: [api]

volumes:
  tracker-data:
