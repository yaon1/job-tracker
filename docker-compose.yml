services:
  api:
    build: ./api
    ports: ['8000:8000']
    environment:
      CORS_ORIGIN: http://localhost:3000
      HH_ACCESS_TOKEN: ${HH_ACCESS_TOKEN:-}
    volumes: ['tracker-data:/data']

  web:
    build:
      context: ./web
      args: { API_BASE: 'http://localhost:8000/api' }
    ports: ['3000:80']
    depends_on: [api]

volumes:
  tracker-data:
